<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' file: data:">
<style>
  @font-face { font-family: 'Inter Display'; font-weight: 500; src: url('assets/InterDisplay-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Inter Display'; font-weight: 600; src: url('assets/InterDisplay-SemiBold.ttf') format('truetype'); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* 层级：截图（只在卡片下方）→ 光效画布 → 玻璃卡片 */
  #snap { position: fixed; background-size: 100% 100%; opacity: 0; }
  #glow { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #card { position: fixed; inset: 0; }
  /* liquid-glass 渲染成几层兄弟元素（玻璃本体 + 高光边框），淡入要落在每一层上；不能放在祖先上，否则变成 backdrop root 玻璃就看不到光效 */
  #card > * { opacity: var(--card-o, 0); scale: var(--card-s, 0.9); }
  .label {
    font-family: 'Inter Display', 'PingFang SC', sans-serif; font-weight: 600;
    font-size: 17px; letter-spacing: -0.014em; line-height: 1;
    color: #FFFFFF; white-space: nowrap;
    padding: 17px 30px; border-radius: 14px;
    background: rgba(18, 10, 26, 0.16);   /* 很淡的深色托底，晕染很亮时白字也清楚 */
    text-shadow: 0 1px 2px rgba(20, 6, 22, 0.35);
  }
</style>
</head>
<body>
  <div id="snap"></div>
  <canvas id="glow"></canvas>
  <div id="card"></div>
  <script src="dist/app.js"></script>
</body>
</html>
