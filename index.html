<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' file: data:">
<style>
  @font-face { font-family: 'Inter Display'; font-weight: 500; src: url('assets/InterDisplay-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Inter Display'; font-weight: 600; src: url('assets/InterDisplay-SemiBold.ttf') format('truetype'); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; background-size: 100% 100%; opacity: 0; }
  #stage.in  { animation: in 720ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  #stage.out { animation: out 520ms cubic-bezier(0.55, 0, 0.75, 0.2) forwards; }
  @keyframes in  { from { opacity: 0; transform: scale(0.94) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.97); } }
  .label {
    font-family: 'Inter Display', 'PingFang SC', sans-serif; font-weight: 500;
    font-size: 17px; letter-spacing: -0.012em; line-height: 1;
    color: #FFFFFF; white-space: nowrap;
    text-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.22);
    font-feature-settings: "ss01" 0, "cv11" 1;
  }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>
  <script src="dist/app.js"></script>
</body>
</html>
